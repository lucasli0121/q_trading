systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
storage:
  dbPath: /data/db
  engine: wiredTiger
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.3
net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 50
security:
  authorization: enabled

cpu=true
fork=true
