version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s|%(levelname)s|%(name)s|%(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  brief:
    format: "%(asctime)s|%(levelname)s|%(message)s"
    datefmt: "%H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.TimedRotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: log/archive.log
    when: midnight
    backupCount: 30
    encoding: utf8

loggers:
  archive:
    level: INFO
    handlers: [console, file]
    propagate: false

root:
  level: WARNING
  handlers: [console]
