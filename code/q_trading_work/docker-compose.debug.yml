version: '3.4'

services:
  q_trading_work:
    image: q_trading_work:latest
    container_name: q_trading_work
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      - TZ=Asia/Shanghai
    extra_hosts:
    - "host.docker.internal:host-gateway"
    # 调试时覆盖入口命令，让容器保持运行
    entrypoint: ["sleep", "infinity"]

    volumes:
      # ---- Claude Code 配置 ----
      - c:/users/lucasli/.claude:/home/appuser/.claude
      - c:/users/lucasli/.codex:/home/appuser/.codex
      - ../q_trading_work:/q_trading_work
