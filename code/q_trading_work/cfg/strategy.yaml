strong_rebound_strategy:
  match:
    # 过滤ttm市盈率阈值，市盈率不能超过设定值
    pe_limit: 300
    # 过滤利润率阈值
    profit_limit: 10
    # 判断趋势条件 7...15 短线..中长线
    trend_days_limit: 7
    # 最近连续交易日数：用于计算反弹、回撤等因子的时间窗口
    consecutive_days: 5
    # 向上趋势分数阈值：趋势因子得分需 >= 此值时认为趋势行情
    up_trend_score: 6.0
    # 连续反弹分值，趋势不达标时，需满足此分值，即为买入条件
    rebound_score: 10.0
  buy:
    # 连续分钟数：用于成交量放大因子的时间窗口
    consecutive_minutes: 10
    # 分钟交易中，日内分钟趋势限制
    trend_minutes_limit: 10
    # 买入最小分数：当天累计加分需 >= 此值才触发买入
    min_score: 6.0
  sell:
    # 分钟交易中，日内分钟趋势限制
    trend_minutes_limit: 10
    # vwap 均价连续分钟
    vwap_minutes_limit: 10
    # 回撤阈值（%）：从持仓最高点回撤超过此值触发卖出
    drawdown_pct: -6.0
    # 卖出最大分数：当天累计减分 <= 此值触发卖出
    max_score: -8.0

swing_trading_strategy:
  match:
    # 日K阻力支撑位检测连续窗口数
    sr_window: 10
    sr_tolerance: 0.02
    # ---- 趋势过滤（买入侧闸门）----
    # 本策略做的是震荡市：下跌趋势里支撑位会被逐个跌穿。ADX 达门槛且 −DI > +DI
    # 时判为下跌趋势，当天该股只做卖出不做买入（卖出与回撤止损不受影响）。
    # 只认「明确的下跌趋势」，故必须同时满足 ADX 门槛 —— 否则震荡市里 DI 频繁
    # 交叉会随机剔掉一半股票。ADX 周期：talib lookback = 2×该值。
    trend_days_limit: 14
    # ADX 强度门槛（< 该值时视为震荡，不做趋势过滤）
    trend_adx_threshold: 25.0
    # 趋势判定与枢轴点计算共用的日K取数根数（一次取数喂两个用途）
    trend_kline_days: 40
  buy:
    # 分钟买入判定里布林带因子的窗口（BollSRFactor.timeperiod）
    buy_sr_window: 10
  sell:
    # 分钟卖出判定里布林带因子的窗口（BollSRFactor.timeperiod）
    sell_sr_window: 10
    # 自持仓最高点回撤阈值（%）：回撤超过此值时计入卖出分值
    drawdown_pct: -6.0
    # 触发回撤阈值时计入卖出判定的分值（10 分制，负值）。
    # 与位置分「叠加」而非「平均」：-6.0 单独一条即可触发卖出（阈值是「< 0」）
    drawdown_score: -6.0
  risk:
    # 账户级回撤阈值（%）：账户已实现权益自峰值回撤达此值时，在卖出判定中计入
    # drawdown_score 分值（**不冻结开新仓**）；0 或正数表示关闭。
    # 口径与成交量策略、BaseStrategy.RISK_MAX_DRAWDOWN_PCT 一致：策略拿不到账户
    # 权益，回撤值由 workflow / 回测在调用策略前注入
    max_drawdown_pct: -10.0
    # 账户回撤达阈值时计入卖出判定的分值（10 分制，负值）
    drawdown_score: -6.0

volume_expansion_strategy:
  match:
    # 成交量因子窗口（因子内部下限 5）：日线取数窗口 40 根，留足均线/斜率所需历史
    volume_days: 20
    # 选股方向：momentum=放量看多（因子原始语义，2026-10-11 起为本阶段默认），
    # reversion=缩量看多。选股方向与买入方向**各自独立、默认值相反**，
    # 组合语义见 strategy/volume_expansion_strategy.py 模块 docstring 第三节。
    # 注意：日频回测只走「选股」这一条路径 ⇒ 回测口径随本项变化
    # （2026-09-29 快照：momentum 17 笔 −16.24%、reversion 293 笔 +8.69%）
    volume_mode: momentum
    # reversion 模式下的「缩量」上限：成交量打分 <= 此值才允许买入。
    # 默认 4.0 = 因子自身的 BUY 阈值，即「因子判 BUY/STRONG_BUY 的一律不买」
    quiet_volume_score: 4.0
    # 搭配因子：boll_sr / kline_sr / multi_trend / ma / vwap / adx
    # 默认 boll_sr（布林带支撑/阻力位）—— 实测中唯一与成交量互补的因子族
    # （正 IC + 与成交量负相关），趋势/动量类因子与成交量信息重复
    partner_factor: boll_sr
    # 搭配因子门槛（>=）：默认 0 表示「不在阻力区/未破支撑」
    partner_min_score: 0.0
    # 选股成交量打分门槛（10 分制，momentum 模式；= 因子的 BUY 阈值）
    volume_score: 4.0
    # 选股综合分门槛（10 分制）：综合分 = 5.0（两道门槛都通过）+ 最多 5.0（强度），
    # 因此 5.0 等价于「只用两道门槛筛选」，调高才要求更强的量能/位置
    min_score: 5.0
  buy:
    # 分钟数据最少条数；实际门槛取 max(本值, 成交量因子窗口, 搭配因子所需根数)
    # （ADX 类搭配因子需要 2×period 根，不足时 talib 返回 NaN 会恒定给负分）
    min_minutes: 20
    # 分钟级成交量打分门槛（momentum 模式）
    volume_score: 4.0
    # 空 = 跟随 match.partner_factor
    partner_factor: ""
    # 买入方向：reversion=缩量看多（2026-10-11 起为本阶段默认），momentum=放量看多。
    # **不再支持「空 = 跟随 match.volume_mode」**：两层方向本就相反，写成空值会被解析为
    # 买入侧默认值 reversion，而不是选股方向
    volume_mode: reversion
    quiet_volume_score: 4.0
    partner_min_score: 0.0
    min_score: 5.0
    # 成交量侧与搭配侧权重：成交量为主、搭配做确认
    volume_weight: 0.6
    partner_weight: 0.4
    # 日内形态：形态分换算成买入门槛偏移（正 = 更难买），口径同 buy_threshold_offset。
    # 不做 combined 的加减项：BASE_SCORE == MIN_SCORE == 5.0，两道门槛通过时
    # combined 恒 >= 5.0，减分等于硬否决、加分不改变判定。
    # 规则表默认空（形态恒中性），见 factor/intraday_shape_factor.py
    shape_enabled: true
    # 形态最差（0 分）时抬高门槛的幅度；0 = 不影响门槛
    shape_max_offset: 1.0
    # 前几段走完才判分：2 = 11:30 后生效（前两段符号此时定型）
    shape_min_segments: 2
    # 跨日形态序列：昨日及更早的日形态（冲高回落 / 低开低走 / …）连弱时压低买入预期。
    # 读归档 parquet，目录取 stock.cfg 的 [local_hq] root；root 为空即自动关闭。
    # 该层是隔夜已定型的信息，盘中随时可用，不受「前 2 段走完」限制。
    shape_seq_enabled: true
    # 跨日层最差（形态分 0）时抬高门槛的幅度；0 = 只观测、不影响门槛（默认）
    shape_seq_max_offset: 0.0
    # 回看多少个交易日
    shape_seq_days: 5
    # 跨日趋势判据的均线周期：回看窗口内「收盘价低于/高于 N 日均线」计次。
    # 只影响日线序列读取长度（shape_seq_days + N - 1 天），不影响其它编码。
    shape_ma_period: 5
    # 当日「早盘见高 + 从峰值回撤 ≥2.5%」的形态分修正：负 = 更难买，0 = 不参与。
    # 这是「9:30–10:30 冲高、随后一路下跌」的直接判据，与开盘缺口无关。
    shape_dive_score: 0.0
    # 跨日规则表（默认全空 = 不改变任何判定）。六个键全部可选，语法：
    #   shape_seq_rules:
    #     weak_streak: {2: -1.0, 3: -2.0}       # 连续弱势天数下限 -> 形态分修正
    #     prev_day: {"低开低走": -1.0}            # 昨日形态 -> 形态分修正
    #     sequence: {"低开低走|高开低走": -1.5}     # 标签串（昨日在前）-> 修正
    #     below_ma: {3: -1.0}                    # 收盘低于N日均线次数下限 -> 修正
    #     above_ma: {3: +1.0}                    # 收盘高于N日均线次数下限 -> 修正
    #     lower_high: {3: -1.0}                  # 最高价低于前日次数下限 -> 修正
    #     higher_high: {3: +1.0}                 # 最高价高于前日次数下限 -> 修正
    # 启用前先看 _shape_stats.py 的「连续弱势」「昨日形态」「低于均线次数」
    # 「高点低于前日次数」四张统计表。
    shape_seq_rules: {}
  sell:
    # 分钟数据最少条数；实际门槛同样取与因子窗口的较大值
    min_minutes: 20
    # 卖出分阈值：累计负分 <= 此值触发卖出
    max_score: -6.0
    # 自持仓最高点回撤阈值（%）
    drawdown_pct: -6.0
    # 均价（VWAP）窗口
    vwap_minutes: 10
  risk:
    # 账户级回撤阈值（%）：账户已实现权益自峰值回撤达此值时，在卖出判定中计入
    # drawdown_score 分值（**不冻结开新仓**，回撤超限只有整体降仓这一种效果）；
    # 0 或正数表示关闭
    max_drawdown_pct: -10.0
    # 账户回撤达阈值时计入卖出判定的分值（10 分制，负值）；
    # 默认与 sell.max_score 等值，即「账户回撤超阈值」单独一条即可触发卖出信号
    drawdown_score: -6.0
