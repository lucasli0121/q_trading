[strategy]
type=趋势追踪, 反弹策略, 网格交易策略, 反转策略, 多因子选股, 基本面策略
[signal_filter]
# 信号风暴过滤：连续相同方向信号需同时满足以下条件才发出新信号
# 价格变化阈值（%）：超过此阈值才发出新信号
price_change_threshold=2.0
# 时间间隔阈值（分钟）：超过此间隔才发出新信号
time_gap_minutes=10
[cost_config]
# 买入滑点（元）：成交价 = 当前价 + buy_slip，为了快速成交
buy_slip=0.2
# 卖出滑点（元）：成交价 = 当前价 - sell_slip
sell_slip=0.2
# 手续费百分率（%）：如 0.02 表示 0.02%，成交 100 元收 0.02 元
fee_pct=0.02
# 最低手续费（元）：按比例计算不足时按此收取
fee_low=5
[workflow]
service_name=workflow_service_1
[redis]
enable=true
host=192.168.1.63
port=16379
password=redis@123
db=0
enable_ssl=false
cert = cert/client.crt
key = cert/client.key
ca = cert/ca.crt
