version: 1
formatters:
  simpler:
    format: "%(asctime)s-%(name)s-%(lineno)s-%(levelname)s: %(message)s"
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simpler
    stream: ext://sys.stdout

  # filename 支持 {instance} 占位符（替换为 [data_proxy] name）。
  # 多实例共用同一个 log 目录时改成 log/info_{instance}.log，避免多个进程
  # 同时轮转同一个文件造成日志错乱或丢失；单实例部署可保持原样。
  info_file_handler:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    when: 'D'
    formatter: simpler
    filename: log/info.log
    encoding: utf8

  error_file_handler:
    class: logging.handlers.TimedRotatingFileHandler
    level: ERROR
    when: 'D'
    formatter: simpler
    filename: log/errors.log
    encoding: utf8
loggers:
  my_module:
    level: ERROR
    handlers: [console, error_file_handler]
root:
  level: INFO
  handlers: [console, info_file_handler, error_file_handler]
